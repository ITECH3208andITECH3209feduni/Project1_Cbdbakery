<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Bakery Admin</title>
<style>

    :root{
     --green:#27ae60;
     --black:#333;
     --white:#fff;
     --bg-color:#eee;
     --box-shadow:0 .5rem 1rem rgba(0,0,0,.1);
     --border:.1rem solid var(--black);
         
    }
    
    html{
    font-size:62.5%;
    overflow-x:hidden;
    
    }
    
    .btn{
        display: block;
        width: 100%;
        cursor: pointer;
        border-radius: .5rem;
        margin-top: 1rem;
        font-size: 1.7rem;
        padding: 1rem 3rem;
        background: var(--green);
        color: var(--white);
    }
    
    .btn:hover{
        background: var(--black);
    
    }
    
    .btn2{
        display: block;
        width: 88%;
        cursor: pointer;
        border-radius: .5rem;
        margin-top: 1rem;
        font-size: 1.7rem;
        padding: 1rem 3rem;
        background: var(--green);
        color: var(--white);
        text-align: center; 
    
    }
    
    .btn2:hover{
        background: var(--black);
    
    }
    
    .btn1{
        display: block;
        width: 80%;
        cursor: pointer;
        border-radius: .5rem;
        margin-top: 1rem;
        font-size: 1.7rem;
        padding: 1rem 3rem;
        background: var(--green);
        color: var(--white);
    }
    
    .btn1:hover{
        background: var(--black);
    
    }
    
    .container{
     max-width: 1200px;
     padding: 2rem;
     margin:0 auto;
    
    }
    
    .admin-product-form-container form{
    max-width: 50rem;
    margin:0 auto;
    padding: 2rem;
    border-radius: .5rem;
    background: var(--bg-color);
    
    }
    
    .admin-product-form-container form h2{
        text-transform: uppercase;
        color:var(--black);
        margin-bottom: 1rem;
        text-align: center;
        font-size: 2.5rem;
    }
    
    .admin-product-form-container form .box{
        width: 60%;
        border-radius: .5rem;
        padding: 1.2rem 1.5rem;
        font-size: 1.5rem;
        margin: 1rem 0;
        background: var(--white);
        text-transform: none;
    }
    
    .admin-product-form-container form .table{
        
        border-radius: .5rem;
        padding: 1.2rem 1.5rem;
        font-size: 1.7rem;
        margin: 1rem 0;
        text-transform: none;
    }
    
    .product-display {
        margin:2rem 0;
        overflow-y: scroll; 
    }
    
    .product-display .product-display-table{
    width:100%;
    text-align:center;
    
    }
    
    .product-display .product-display-table thead{
        
        background: var(--bg-color);
    
    }
    .product-display .product-display-table th{
      padding:1rem; 
      font-size:2rem;
     
    }
    
    .product-display .product-display-table td{
      padding:1rem; 
      font-size:2rem;
      border-bottom: var(--border);
    
    }
    
    .product-display .product-display-table .btn1:first-child{
         margin-top: 0; 
         
    }
    
    .product-display .product-display-table .btn1:last-child{
         background: red; 
         
    }
    
    .product-display .product-display-table .btn1:last-child:hover{
         background: var(--black); 
         
    }
    
    </style>
    
   
    </head>
    <body>
    
    <div class="container">
        <div class="admin-product-form-container">
        
        <form action="index.php" method="POST" enctype="multipart/form-data">
        <h2>Add Product</h2>
            <label for="name" class="table">Product Name:</label>
            <input type="text" name="name" id="name" class="box" required><br><br>
    
            <label for="price" class="table">Price:</label>
            <input type="number" step="0.01" name="price" id="price" class="box" required><br><br>
    
            <label for="category" class="table">Category:</label> 
            <select name="category" id="category" class="box" required>
                 <option value="Partyorders">Partyorders</option> 
                <option value="Pies">Pies</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Donuts">Donuts</option>
                <option value="Cakes">Cakes</option>
                
               
                
            </select><br><br>
    
            <label for="image" class="table">Product Image:</label>
            <input type="file" name="image" id="image" accept="image/*"  class="box"><br><br>
    
            <input type="submit" class="btn" value="Add Product">
            <a href="mainadmin.html" class="btn2">Go Back</a>
        </form>
    </div>
    
    
    <div class="product-display">
    <form action="index1.php" method="post"></form>
        <table class="product-display-table">
            <thead>
                <tr> 
                    <th>Product Image</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th colspan="2">Action</th>
                </tr>
            </thead>
    
            
        </table>
    
    </div>
    
    </table>
    
    
     </div>
    
    
    
        </div>
    
        
    </body>
    </html>
